<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrega de Prácticas CSS</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f0f2f5; 
            padding: 40px; 
            text-align: center; 
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            margin-bottom: 30px;
        }
        .menu { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            max-width: 400px; 
            margin: 0 auto; 
        }
        a.btn { 
            padding: 15px 20px; 
            background-color: #6c5ce7; 
            color: white; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s ease, transform 0.2s ease; 
        }
        a.btn:hover { 
            background-color: #5a4bcf; 
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <h1>Ejercicios de Práctica - CSS</h1>
    <p>Haz clic en cualquiera de las opciones para abrir la práctica correspondiente:</p>

        <a class="btn" href="clase2.html" target="_blank">Clase 2: Media Queries (Cambio de Color)</a>
        <a class="btn" href="clase3.html" target="_blank">Clase 3: Transition Hover</a>
        <a class="btn" href="clase4.html" target="_blank">Clase 4: Animación de Texto</a>
    </div>

</body>
</html>
